<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>BasketVibe</title>
<style>
:root{--bg:#080d18;--panel:#111a2b;--panel2:#172238;--line:#263653;--text:#f4f7fb;--muted:#9badc7;--green:#31d07f;--red:#ff6675;--gold:#ffcc66;--blue:#6bb6ff;--purple:#b99cff;--cyan:#6fe4ff}
*{box-sizing:border-box}html,body{min-height:100%;background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#0b1221 0,#070b13 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;background:rgba(8,13,24,.95);backdrop-filter:blur(14px);padding:12px 0 10px}.brandRow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:43px;height:43px;border-radius:11px}.brand h1{font-size:20px;margin:0}.sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.importBtn{border:1px solid #34527d;background:#162642;color:#dbeaff;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700}.importBtn:active{transform:scale(.98)}.dbLine{display:flex;align-items:center;gap:7px;font-size:10px;color:#8093b2;margin:-3px 1px 9px}.dot{width:7px;height:7px;border-radius:50%;background:#6b7280;flex:0 0 auto}.dot.ok{background:var(--green);box-shadow:0 0 10px #31d07f66}.search{width:100%;font-size:17px;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:#10192a;color:white;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #6bb6ff22}.results{position:absolute;left:14px;right:14px;top:145px;background:#111a2b;border:1px solid var(--line);border-radius:14px;max-height:52vh;overflow:auto;box-shadow:0 18px 50px #0009;display:none}.result{padding:12px 14px;border-bottom:1px solid #263653;display:flex;justify-content:space-between;gap:8px}.result:last-child{border:0}.result b{font-size:15px}.tag{font-size:11px;color:#bcd0ec}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#22314d;color:#cbdaf0;font-size:11px}.pill.active{background:#103a2a;color:#7cebb1}.card{background:linear-gradient(180deg,var(--panel),#0e1727);border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0;box-shadow:0 8px 24px #0003}.hero{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.hero h2{margin:0 0 5px;font-size:24px}.meta{color:var(--muted);font-size:13px;line-height:1.5}.ask{text-align:right}.ask .num{font-size:22px;font-weight:800}.sectionTitle{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#9fb2d1;margin:18px 3px 7px}.valueGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.value{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px}.value .lbl{font-size:11px;color:var(--muted)}.value .num{font-size:20px;font-weight:800;margin-top:3px}.value.primary{border-color:#2c8060;background:linear-gradient(180deg,#123527,#10291f)}.value.legacy{opacity:.9}.bargain{padding:14px;border-radius:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}.good{background:#103a2a;border:1px solid #267c58;color:#86efb8}.bad{background:#3b1720;border:1px solid #8d3545;color:#ff9fab}.neutral{background:#342c17;border:1px solid #78642c;color:#ffe092}.scores{display:grid;gap:8px}.scoreRow{display:grid;grid-template-columns:30px 1fr 48px;gap:8px;align-items:center}.bar{height:9px;background:#25324b;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#6bb6ff,#b99cff)}.best .fill{background:linear-gradient(90deg,#31d07f,#8df1bd)}.best strong{color:#83ebb3}.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.skill{background:#151f33;border-radius:11px;padding:9px 5px;text-align:center}.skill .k{font-size:10px;color:var(--muted)}.skill .v{font-size:18px;font-weight:750}.miniGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mini{background:#151f33;border-radius:11px;padding:10px}.mini .k{font-size:10px;color:var(--muted)}.mini .v{font-size:15px;font-weight:750;margin-top:2px;word-break:break-word}.comp{display:grid;grid-template-columns:1fr auto;gap:7px;padding:11px 0;border-bottom:1px solid #24324d}.comp:last-child{border:0}.compName{font-weight:650}.compMeta{font-size:11px;color:var(--muted);margin-top:2px}.compPrice{text-align:right;font-weight:750}.sim{font-size:10px;color:#80dba9;margin-top:2px}.history{display:grid;gap:8px}.historyRow{background:#151f33;border-radius:11px;padding:10px 11px;display:grid;grid-template-columns:1fr auto;gap:10px}.historyTitle{font-weight:650}.historyMeta{font-size:11px;color:var(--muted);margin-top:3px}.historyPrice{font-weight:750;text-align:right}.notice{font-size:11px;color:#b7c5db;background:#172238;border:1px solid #2b3d5f;border-radius:12px;padding:10px 12px;line-height:1.45}.empty{text-align:center;color:var(--muted);padding:48px 18px}.empty h2{color:#dbe8fa;margin-bottom:8px}.footer{font-size:10px;color:#71829e;text-align:center;margin:24px 8px}.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;background:#172238;border:1px solid #3a5279;color:#eef5ff;border-radius:13px;padding:12px 14px;box-shadow:0 14px 40px #0009;display:none}.toast.goodToast{border-color:#287d59}.toast.badToast{border-color:#8d3545}.hidden{display:none!important}.details{margin-top:9px}.details summary{color:#bdd0ed;font-size:12px;cursor:pointer}.allGrid{display:grid;grid-template-columns:1fr;gap:5px;margin-top:9px}.kv{display:grid;grid-template-columns:minmax(120px,.8fr) 1.2fr;gap:8px;padding:7px 0;border-bottom:1px solid #22314d;font-size:11px}.kv .k{color:#8195b4}.kv .v{color:#dce8f8;word-break:break-word}@media(min-width:600px){.valueGrid{grid-template-columns:repeat(4,1fr)}.skills{grid-template-columns:repeat(8,1fr)}.miniGrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brandRow">
      <div class="brand"><img src="basketball_icon.png"><div><h1>BasketVibe</h1><div class="sub">Pocket market scout</div></div></div>
      <button class="importBtn" id="importBtn">IMPORT DB</button>
    </div>
    <div class="dbLine"><span class="dot" id="dbDot"></span><span id="dbText">Checking database…</span></div>
    <input class="search" id="q" placeholder="Search player…" autocomplete="off" spellcheck="false">
    <div class="results" id="results"></div>
  </div>
  <main id="main"><div class="empty"><h2>Search a player</h2><div>The app uses the full BasketVibe mobile SQLite database on your phone.</div></div></main>
  <div class="footer" id="footer"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const q=document.getElementById('q'),results=document.getElementById('results'),main=document.getElementById('main'),dbDot=document.getElementById('dbDot'),dbText=document.getElementById('dbText'),footer=document.getElementById('footer'),toast=document.getElementById('toast');
let status={},currentPlayerId=null,searchTimer=null;
const hasBridge=()=>typeof BasketVibe!=='undefined';
const parse=s=>{try{return JSON.parse(s)}catch(e){return null}};
const money=v=>v==null||v===''?'—':Math.round(Number(v)).toLocaleString('en-US');
const pct=v=>v==null?'—':`${(Number(v)*100).toFixed(1)}%`;
const num=(v,d=1)=>v==null?'—':Number(v).toFixed(d);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate=s=>{if(!s)return'—';let x=String(s);if(/^\d{2}\.\d{2}\.\d{4}$/.test(x))return x;try{const d=new Date(x);if(!isNaN(d))return d.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){}return x};
function showToast(msg,kind=''){toast.textContent=msg;toast.className='toast '+kind;toast.style.display='block';clearTimeout(window.__toastT);window.__toastT=setTimeout(()=>toast.style.display='none',3500)}
function refreshStatus(){if(!hasBridge()){dbText.textContent='Android database bridge unavailable';return}status=parse(BasketVibe.getStatusJson())||{};dbDot.classList.toggle('ok',!!status.ready);if(!status.ready){dbText.textContent='No valid database · tap IMPORT DB';footer.textContent='';return}const m=status.meta||{},scan=m.latest_market_scan||m.exported_at_utc||'unknown';dbText.textContent=`DB ${fmtDate(scan)} · ${status.players||0} players · ${status.transfers||0} sales`;footer.textContent=`V2 ${m.v2_artifact_version||''} · ${m.price_method||'basketball_v1'} K=${m.price_k||8} comps · ${status.snapshots||0} snapshots`;}
function doSearch(){if(!hasBridge()||!status.ready){results.style.display='none';return}const s=q.value.trim();if(!s){results.style.display='none';return}const a=parse(BasketVibe.searchPlayers(s))||[];results.innerHTML=a.map(p=>`<div class="result" data-id="${esc(p.player_id)}"><div><b>${esc(p.player_name)}</b><div class="tag">${esc(p.position)} · ${p.age??'—'}y · ${p.height_cm??'—'}cm · PS ${p.ps??'—'}</div></div><div style="text-align:right"><span class="pill ${Number(p.is_active)===1?'active':''}">${Number(p.is_active)===1?'ACTIVE':'KNOWN'}</span><div class="tag">${money(p.display_price)}</div></div></div>`).join('');results.style.display=a.length?'block':'none'}
q.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(doSearch,100)});q.addEventListener('focus',doSearch);
document.addEventListener('click',e=>{const r=e.target.closest('.result');if(r){selectPlayer(r.dataset.id);results.style.display='none';return}if(!e.target.closest('.top'))results.style.display='none'});
document.getElementById('importBtn').addEventListener('click',()=>{if(hasBridge())BasketVibe.requestImport()});
window.onDatabaseImported=function(r){refreshStatus();if(r&&r.success){showToast(r.message||'Database imported','goodToast');q.value='';currentPlayerId=null;main.innerHTML='<div class="empty"><h2>Database updated</h2><div>Search a player to use the new snapshot.</div></div>'}else showToast((r&&r.message?r.message:'Import failed')+(r&&r.detail?' · '+r.detail:''),'badToast')};
function vcard(label,val,cls=''){return `<div class="value ${cls}"><div class="lbl">${label}</div><div class="num">${money(val)}</div></div>`}
function mini(k,v){return `<div class="mini"><div class="k">${k}</div><div class="v">${v}</div></div>`}
function allFields(p){const skip=new Set(['player_id','player_name']);return Object.keys(p).filter(k=>!skip.has(k)).map(k=>`<div class="kv"><div class="k">${esc(k)}</div><div class="v">${esc(p[k]==null?'—':p[k])}</div></div>`).join('')}
function selectPlayer(id){if(!hasBridge())return;const p=parse(BasketVibe.getPlayer(id))||{};if(!p.player_id)return;currentPlayerId=id;q.value=p.player_name;location.hash=encodeURIComponent(id);const comps=parse(BasketVibe.getComparables(id))||[],transfers=parse(BasketVibe.getTransfers(id))||[],listings=parse(BasketVibe.getListings(id))||[];
const active=Number(p.is_active)===1,currentPrice=p.current_price==null?null:Number(p.current_price),ratio=p.v2_price_to_value==null?null:Number(p.v2_price_to_value),discount=p.v2_discount_pct==null?null:Number(p.v2_discount_pct);let bc='neutral',bt='No active-price V2 comparison',right='';if(active&&currentPrice!=null&&ratio!=null){if(discount>=15){bc='good';bt=`BARGAIN · ${discount.toFixed(1)}% below V2`}else if(discount<=-15){bc='bad';bt=`EXPENSIVE · ${Math.abs(discount).toFixed(1)}% above V2`}else{bc='neutral';bt=`FAIR · within ${Math.abs(discount).toFixed(1)}% of V2`}right=`${money(currentPrice)} → ${money(p.v2_value)}`}
const best=p.manual_best_slot;const scoreRows=[['PG',p.pg_manual_score],['SG',p.sg_manual_score],['SF',p.sf_manual_score],['PF',p.pf_manual_score],['C',p.c_manual_score]].map(([pos,s])=>`<div class="scoreRow ${pos===best?'best':''}"><strong>${pos}</strong><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,Number(s)||0))}%"></div></div><strong>${s==null?'—':Number(s).toFixed(1)}</strong></div>`).join('');
const skills=[['2P',p.two_point],['3P',p.three_point],['DEF',p.defense],['PAS',p.passing],['BH',p.ball_handling],['REB',p.rebounding],['STA',p.stamina],['ATH',p.athleticism]].map(([k,v])=>`<div class="skill"><div class="k">${k}</div><div class="v">${v??'—'}</div></div>`).join('');
const compPrices=comps.map(c=>Number(c.comp_clearing_price)).filter(Number.isFinite).sort((a,b)=>a-b),med=compPrices.length?compPrices[Math.floor((compPrices.length-1)/2)]:null,q25=compPrices.length?compPrices[Math.floor((compPrices.length-1)*.25)]:null,q75=compPrices.length?compPrices[Math.floor((compPrices.length-1)*.75)]:null;
const compHtml=comps.map(c=>`<div class="comp"><div><div class="compName">#${c.comp_rank} ${esc(c.comp_player_name)}</div><div class="compMeta">${esc(c.comp_position)} · ${c.comp_age??'—'}y · ${c.comp_height_cm??'—'}cm · ${fmtDate(c.comp_first_observed_at)}</div><div class="sim">distance ${num(c.distance,3)} · age gap ${num(c.age_diff_years,0)}y · weight ${num(c.neighbor_weight,3)}</div></div><div class="compPrice">${money(c.comp_clearing_price)}</div></div>`).join('');
const transferHtml=transfers.map(t=>`<div class="historyRow"><div><div class="historyTitle">${esc(t.seller_name||'—')} → ${esc(t.buyer_name||'—')}</div><div class="historyMeta">${fmtDate(t.transfer_date)} · ${esc(t.confidence||'')}</div></div><div class="historyPrice">${money(t.clearing_price)}</div></div>`).join('')||'<div class="meta">No recorded transfers.</div>';
const listingHtml=listings.map(l=>`<div class="historyRow"><div><div class="historyTitle">${esc(l.status)} · ${esc(l.outcome)}</div><div class="historyMeta">${fmtDate(l.first_seen_at)} → ${fmtDate(l.last_seen_at)}</div></div><div class="historyPrice">${money(l.last_price)}</div></div>`).join('')||'<div class="meta">No listing history.</div>';
main.innerHTML=`
<div class="card"><div class="hero"><div><h2>${esc(p.player_name)}</h2><div class="meta">Listed ${esc(p.position)} · ${p.age??'—'} years · ${p.height_cm??'—'} cm / ${p.weight_kg??'—'} kg<br>PS ${p.ps??'—'} · Best calculated slot <b>${esc(best||'—')}</b> ${p.manual_current_score==null?'':num(p.manual_current_score)}</div></div><div class="ask"><span class="pill ${active?'active':''}">${active?'ACTIVE':'LAST SEEN'}</span><div class="num">${money(active?p.current_price:p.latest_observed_price)}</div><div class="sub">${active?'current price':'last observed price'}</div></div></div></div>
<div class="sectionTitle">Exact valuations</div><div class="valueGrid">${vcard('V2 PRIMARY',p.v2_value,'primary')}${vcard('K4',p.k4_value)}${vcard('K3',p.k3_value)}${vcard('LEGACY',p.legacy_production_value,'legacy')}</div>
<div class="card"><div class="bargain ${bc}"><span>${bt}</span><span>${right}</span></div></div>
<div class="sectionTitle">Calculated position scores</div><div class="card"><div class="scores">${scoreRows}</div><div class="meta" style="margin-top:12px">Best slot: <b>${esc(best||'—')}</b> · Height-qualified: <b>${esc(p.height_qualified_recommended_slot||'—')}</b><br>${esc(p.manual_best_archetype||'')} ${p.manual_best_slot_height_note?'· '+esc(p.manual_best_slot_height_note):''}</div></div>
<div class="sectionTitle">Skills</div><div class="card"><div class="skills">${skills}</div></div>
<div class="sectionTitle">Market context</div><div class="card"><div class="miniGrid">${mini('Certainty hybrid',money(p.certainty_hybrid_value))}${mini('Predicted tier',esc(p.predicted_tier||'—'))}${mini('Tier confidence',pct(p.q_max))}${mini('P ≥ 50k',pct(p.P_ge_50k))}${mini('Low-tier median',money(p.low_tier_median))}${mini('Mid-tier median',money(p.mid_tier_median))}${mini('High-tier median',money(p.high_tier_median))}${mini('Development',esc(p.development_label||'—'))}</div><div class="meta" style="margin-top:10px">Mode: ${esc(p.certainty_hybrid_mode||'—')} · correction ×${num(p.v2_correction_multiplier,3)} · development index ${num(p.development_index,1)}</div></div>
<div class="sectionTitle">Closest comparable sales</div><div class="card"><div class="miniGrid">${mini('K=8 median',money(med))}${mini('Middle 50%',`${money(q25)}–${money(q75)}`)}${mini('Last own sale',money(p.last_sale_price))}${mini('Last sale date',esc(p.last_sale_date||'—'))}</div><div style="margin-top:8px">${compHtml||'<div class="meta">No comparable sales.</div>'}</div></div>
<div class="sectionTitle">Transfer history</div><div class="card"><div class="history">${transferHtml}</div></div>
<div class="sectionTitle">Listing history</div><div class="card"><div class="history">${listingHtml}</div></div>
<div class="card"><details class="details"><summary>All cached player-analysis fields</summary><div class="allGrid">${allFields(p)}</div></details></div>
<div class="notice">This app reads the imported <b>basketvibe_mobile.sqlite</b> directly. The database contains the full market history plus cached exact V2/K4/K3/Legacy model outputs and comparable-player calculations produced on your PC.</div>`;window.scrollTo({top:0,behavior:'smooth'})}
function fromHash(){if(location.hash.length>1&&status.ready){const id=decodeURIComponent(location.hash.slice(1));selectPlayer(id)}}
window.addEventListener('hashchange',()=>{if(location.hash.length>1)fromHash()});
window.basketVibeBack=function(){if(currentPlayerId){currentPlayerId=null;location.hash='';q.value='';main.innerHTML='<div class="empty"><h2>Search a player</h2><div>The imported full database stays on the phone until you replace it.</div></div>';return true}return false};
refreshStatus();fromHash();
</script>
</body>
</html>
